<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贴图 / Sticker</title>
  <link rel="stylesheet" href="sticker.css?v=101822434783">
</head>
<body class="sticker-root">
  <div class="sticker-frame" id="sticker-frame">
    <div class="sticker-bar" id="sticker-bar">
      <button type="button" class="sticker-close" id="sticker-close" title="关闭">✕</button>
      <button type="button" class="sticker-copy" id="sticker-copy" title="复制图片">⧉</button>
      <button type="button" class="sticker-opacity" id="sticker-opacity" title="透明度">◐</button>
    </div>
    <img class="sticker-image" id="sticker-image" alt="sticker">
    <div class="sticker-resize" id="sticker-resize"></div>
  </div>

  <script src="js/utils/constants.js?v=101822434783"></script>
  <script src="js/i18n.js?v=101822434783"></script>
  <script src="js/utils/error-handler.js?v=101822434783"></script>
  <script>setupGlobalErrorTrap();</script>
  <script src="js/utils/dev-shell.js?v=101822434783"></script>
  <script src="js/utils/storage.js?v=101822434783"></script>
  <script src="js/core.js?v=101822434783"></script>
  <script src="js/sticker-window.js?v=101822434783"></script>
</body>
</html>
