<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贴图 / Sticker</title>
  <link rel="stylesheet" href="sticker.css?v=102514359680">
</head>
<body class="sticker-root">
  <div class="sticker-frame" id="sticker-frame">
    <div class="sticker-bar" id="sticker-bar">
      <button type="button" class="sticker-close" id="sticker-close" title="关闭">✕</button>
      <button type="button" class="sticker-copy" id="sticker-copy" title="复制图片">⧉</button>
      <button type="button" class="sticker-opacity" id="sticker-opacity" title="透明度">◐</button>
      <button type="button" class="sticker-rot-l" id="sticker-rot-l" data-i18n-title="rotateLeft" title="逆时针旋转">↺</button>
      <button type="button" class="sticker-rot-r" id="sticker-rot-r" data-i18n-title="rotateRight" title="顺时针旋转">↻</button>
      <button type="button" class="sticker-flip-h" id="sticker-flip-h" data-i18n-title="flipH" title="水平翻转">⇋</button>
      <button type="button" class="sticker-flip-v" id="sticker-flip-v" data-i18n-title="flipV" title="垂直翻转">⇅</button>
      <button type="button" class="sticker-through" id="sticker-through" data-i18n-title="clickThrough" title="鼠标穿透">⤫</button>
    </div>
    <img class="sticker-image" id="sticker-image" alt="sticker">
    <div class="sticker-resize" id="sticker-resize"></div>
  </div>

  <script src="js/utils/constants.js?v=102514359680"></script>
  <script src="js/i18n.js?v=102514359680"></script>
  <script src="js/utils/error-handler.js?v=102514359680"></script>
  <script>setupGlobalErrorTrap();</script>
  <script src="js/utils/dev-shell.js?v=102514359680"></script>
  <script src="js/utils/storage.js?v=102514359680"></script>
  <script src="js/core.js?v=102514359680"></script>
  <script src="js/sticker-window.js?v=102514359680"></script>
</body>
</html>
